<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Poster AR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* রং আর মাপ এক জায়গায় রাখা হলো */
  :root {
    --bg: #000;
    --panel: rgba(20, 20, 20, 0.8);
    --text: #fff;
    --muted: #bbb;
    --accent: #ffb020;
    --good: #2f8cff;   /* ঠিক জায়গা = নীল */
    --bad: #ff3b30;    /* ভুল/খালি = লাল */
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; } /* hidden দিলে সবসময় লুকাবে */
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: system-ui, "Noto Sans Bengali", sans-serif;
    touch-action: none; /* ব্রাউজারের নিজের zoom/scroll বন্ধ, আমরা নিজেরা gesture ধরব */
    user-select: none;
  }

  /* ক্যামেরার ভিডিও পুরো স্ক্রিন জুড়ে */
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #111; }
  /* ডিজাইনের ছবি রাখার জায়গা */
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #design {
    position: absolute; left: 50%; top: 50%; transform-origin: center center;
    max-width: none; pointer-events: none; opacity: 0.5;
  }
  #design.diff { mix-blend-mode: difference; }
  /* বক্স আঁকার ক্যানভাস (ছবির উপরে, বাটনের নিচে) */
  #ov { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }

  /* মোড অনুযায়ী দেখানো: চিহ্ন মোডে ছবি পুরো, চেক মোডে ছবি লুকানো */
  body[data-mode=mark] #design { opacity: 1 !important; mix-blend-mode: normal; }
  body[data-mode=mark] #cam { opacity: .15; }
  body[data-mode=check] #design { opacity: 0 !important; }
  /* data-show="align mark" — শুধু ঐ মোডগুলোতে দেখাবে */
  body[data-mode=align] [data-show]:not([data-show~=align]),
  body[data-mode=mark]  [data-show]:not([data-show~=mark]),
  body[data-mode=check] [data-show]:not([data-show~=check]) { display: none !important; }

  .bar { position: fixed; left: 0; right: 0; display: flex; gap: 8px; padding: 10px 12px; z-index: 5; }
  #top {
    top: 0; flex-direction: column; padding-top: max(10px, env(safe-area-inset-top));
    background: linear-gradient(rgba(0,0,0,.7), transparent);
  }
  #bottom {
    bottom: 0; flex-direction: column; align-items: stretch;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.8) 30%);
  }
  .hide-ui .bar { display: none; }

  button, .btn {
    background: var(--panel); color: var(--text); border: 1px solid rgba(255,255,255,.15);
    border-radius: var(--radius); padding: 9px 12px; font-size: 14px; font-family: inherit;
    cursor: pointer; white-space: nowrap;
  }
  button.on { background: var(--accent); color: #000; border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row label { font-size: 13px; color: var(--muted); min-width: 60px; }
  input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); height: 30px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { flex: 1; padding: 10px 6px; font-weight: 600; }
  #hint { font-size: 13px; color: #ddd; line-height: 1.4; text-shadow: 0 1px 3px #000; }
  #zoomVal { min-width: 40px; text-align: right; font-size: 13px; }

  #thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; touch-action: pan-x; flex: 1; }
  #thumbs img { height: 52px; border-radius: 8px; border: 2px solid transparent; flex: none; }
  #thumbs img.active { border-color: var(--accent); }

  /* চেক মোডের স্কোর: "৮/১৪ ঠিক" */
  #status { font-size: 20px; font-weight: 700; text-align: center; padding: 8px; border-radius: var(--radius); background: var(--panel); }
  #status.all { background: var(--good); }

  #msg {
    position: fixed; left: 16px; right: 16px; top: 50%; transform: translateY(-50%);
    text-align: center; z-index: 4; font-size: 16px; line-height: 1.6;
    background: var(--panel); border-radius: var(--radius); padding: 18px;
  }
  #toast {
    position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 9;
    background: rgba(0,0,0,.85); padding: 12px 16px; border-radius: var(--radius);
    font-size: 15px; text-align: center; max-width: 86vw; pointer-events: none;
    transition: opacity .3s; opacity: 0;
  }
  #toast.show { opacity: 1; }

  #showUi { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 6; display: none; }
  .hide-ui #showUi { display: block; }
</style>
</head>
<body data-mode="align">
  <video id="cam" autoplay playsinline muted></video>
  <div id="stage"><img id="design" alt=""></div>
  <canvas id="ov"></canvas>

  <div id="msg">
    <b>Poster AR</b><br>
    নিচে <b>＋ ডিজাইন</b> চাপ দিয়ে তোমার দেওয়ালের ডিজাইনের ছবি দাও।
  </div>
  <div id="toast"></div>

  <div id="top" class="bar">
    <!-- ৩টা ধাপ: সাজাও → চিহ্ন দাও → চেক -->
    <div class="tabs">
      <button data-tab="align">① সাজাও</button>
      <button data-tab="mark">② চিহ্ন</button>
      <button data-tab="check">③ চেক</button>
      <button id="hideBtn" style="flex:none">👁</button>
    </div>
    <div class="row">
      <button id="lockBtn" data-show="align">🔓 সরানো যাবে</button>
      <button id="diffBtn" data-show="align" title="রং উল্টে দেখায়, মেলানো সহজ হয়">মিলাও মোড</button>
      <button id="resetBtn" data-show="align">↺</button>
      <button id="autoBtn" data-show="mark">✨ সব নিজে খুঁজো</button>
      <button id="undoBtn" data-show="mark">↶ আনডু</button>
      <button id="clearBtn" data-show="mark">🗑 সব বক্স</button>
      <button id="ghostBtn" data-show="check" class="on">👻 কোনটা কোথায়</button>
      <button id="fsBtn">⛶</button>
      <button id="installBtn" hidden>📲 ইনস্টল</button>
    </div>
    <div id="hint"></div>
  </div>

  <div id="bottom" class="bar">
    <div id="status" data-show="check">—</div>
    <div class="row" data-show="check">
      <label for="sens">কড়াকড়ি</label>
      <input id="sens" type="range" min="30" max="90" value="55">
    </div>
    <div class="row" data-show="align">
      <label for="opacity">স্বচ্ছতা</label>
      <input id="opacity" type="range" min="0" max="100" value="50">
    </div>
    <div class="row" id="zoomRow" data-show="align check" hidden>
      <label for="zoom">zoom</label>
      <button id="zOut">−</button>
      <input id="zoom" type="range" min="1" max="1" step="0.1" value="1">
      <button id="zIn">＋</button>
      <span id="zoomVal">1.0x</span>
    </div>
    <div class="row" data-show="align mark" style="flex-wrap:nowrap">
      <label class="btn" for="file" style="min-width:auto">＋ ডিজাইন</label>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <div id="thumbs"></div>
      <button id="delBtn" title="এই ডিজাইনটা মুছে ফেলো">🗑</button>
    </div>
  </div>

  <button id="showUi">⚙</button>

<script>
// ================= ছোট হেল্পার =================
const $ = (id) => document.getElementById(id);
const cam = $('cam'), design = $('design'), msg = $('msg'), ov = $('ov');
const octx = ov.getContext('2d');
const bn = (n) => String(n).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]); // বাংলা সংখ্যা
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const W = () => innerWidth, H = () => innerHeight;

// localStorage (না চললেও অ্যাপ চলবে)
function store(k, v) { try { localStorage.setItem('po-' + k, JSON.stringify(v)); } catch {} }
function load(k, d) { try { const v = localStorage.getItem('po-' + k); return v ? JSON.parse(v) : d; } catch { return d; } }

let toastT = 0;
function toast(text, ms = 2200) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}
function showMsg(html) { msg.innerHTML = html; msg.hidden = false; }
// কাঁপানো — শুধু ইউজার একবার স্পর্শ করার পর (না হলে ব্রাউজার error দেয়)
function buzz(p) { if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.(p); }

// ================= অবস্থা (state) =================
// view = দেওয়ালের সাথে মেলানো অবস্থান; markView = চিহ্ন দেওয়ার সময় পুরো ছবি দেখানোর অবস্থান
let view = { x: 0, y: 0, s: 1, r: 0 };
let markView = { x: 0, y: 0, s: 1, r: 0 };
let mode = 'align';
let locked = load('locked', false);
let designs = [];        // [{id, url, view}]
let current = null;      // এখন যে ডিজাইন
let boxesAll = load('boxes', {});   // {designId: [{x,y,w,h}]} — ছবির আসল পিক্সেলে
let history = [];        // আনডুর জন্য
let scores = [], good = [];          // চেক মোডে প্রতিটা বক্সের স্কোর আর নীল/লাল
let ghost = load('ghost', true);
let sens = load('sens', 55);

const boxes = () => (current ? (boxesAll[current.id] ||= []) : []);
const T = () => (mode === 'mark' ? markView : view);   // এখন কোন অবস্থান চলছে

// ছবির পিক্সেল (u,v) → স্ক্রিনের পিক্সেল (X,Y)
function toScreen(u, v, t = T()) {
  const nw = design.naturalWidth, nh = design.naturalHeight;
  const a = t.r * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  const dx = (u - nw / 2) * t.s, dy = (v - nh / 2) * t.s;
  return [W() / 2 + t.x + dx * c - dy * s, H() / 2 + t.y + dx * s + dy * c];
}
// উল্টোটা: স্ক্রিন → ছবি
function toMock(X, Y, t = T()) {
  const nw = design.naturalWidth, nh = design.naturalHeight;
  const a = t.r * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  const ex = X - W() / 2 - t.x, ey = Y - H() / 2 - t.y;
  return [(ex * c + ey * s) / t.s + nw / 2, (-ex * s + ey * c) / t.s + nh / 2];
}

// ================= ১. ক্যামেরা (নিজে নিজে ঠিক হয়ে যায়) =================
let stream = null, track = null, camStarting = false, camDenied = false;
let fakeCam = false;   // টেস্টের জন্য নকল ক্যামেরা
let lastCT = -1, lastFrame = 0, bad = 0;

function stopCamera() {
  stream?.getTracks().forEach((t) => t.stop());
  stream = null; track = null; cam.srcObject = null;
}

async function startCamera() {
  if (fakeCam || camStarting) return;
  if (!navigator.mediaDevices?.getUserMedia) {
    showMsg('এই ব্রাউজারে ক্যামেরা চলে না। Chrome দিয়ে খোলো (https লিংকে)।');
    return;
  }
  camStarting = true;
  stopCamera(); // পুরোনোটা আগে বন্ধ, নাহলে ক্যামেরা আটকে কালো হয়ে থাকে
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    if (document.hidden) { s.getTracks().forEach((t) => t.stop()); return; }
    stream = s; track = s.getVideoTracks()[0];
    cam.srcObject = s;
    await cam.play().catch(() => {});
    lastFrame = performance.now(); bad = 0;
    camDenied = false; msg.hidden = true;   // ক্যামেরা চললে পুরনো error বার্তা সরাও
    setupZoom();
  } catch (e) {
    if (e.name === 'NotAllowedError') camDenied = true;
    showMsg('ক্যামেরা চালু হয়নি 😕<br>ব্রাউজারকে ক্যামেরার অনুমতি দাও, তারপর পেজ রিলোড করো।<br><small>(' + e.name + ')</small>');
  } finally { camStarting = false; }
}

// পাহারাদার: প্রতি ১.৫ সেকেন্ডে দেখে ভিডিও চলছে কিনা। থেমে/কালো হলে আবার চালু করে।
setInterval(() => {
  if (document.hidden || fakeCam || camStarting || camDenied) return;
  if (cam.currentTime !== lastCT) { lastCT = cam.currentTime; lastFrame = performance.now(); }
  const live = track && track.readyState === 'live';
  if (live && cam.paused) cam.play().catch(() => {});
  const stuck = !live || !cam.videoWidth || performance.now() - lastFrame > 3000;
  if (stuck) { if (++bad >= 2) { bad = 0; startCamera(); } } else bad = 0;
}, 1500);

// অ্যাপ থেকে বের হলে ক্যামেরা ছেড়ে দাও, ফিরলে আবার চালু
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (!fakeCam) stopCamera(); }
  else { keepAwake(); startCamera(); }
});

// ---- ক্যামেরা zoom ----
let zoomWant = load('zoom', null);
function setupZoom() {
  const caps = track?.getCapabilities?.();
  if (!caps?.zoom) { $('zoomRow').hidden = true; return; }
  const z = $('zoom');
  z.min = caps.zoom.min; z.max = caps.zoom.max; z.step = caps.zoom.step || 0.1;
  $('zoomRow').hidden = false;
  // আগের zoom মনে রেখে আবার বসাও (ক্যামেরা restart হলেও)
  applyZoom(zoomWant ?? track.getSettings().zoom ?? caps.zoom.min);
}
let zoomBusy = false, zoomNext = null;
async function applyZoom(v) {
  const z = $('zoom');
  v = clamp(Number(v), Number(z.min), Number(z.max));
  z.value = v; $('zoomVal').textContent = v.toFixed(1) + 'x';
  zoomWant = v; store('zoom', v);
  if (!track) return;
  // এক সাথে অনেকবার পাঠালে ফোন আটকে যায়, তাই একটার পর একটা
  if (zoomBusy) { zoomNext = v; return; }
  zoomBusy = true;
  try { await track.applyConstraints({ advanced: [{ zoom: v }] }); }
  catch (e) { toast('zoom হয়নি: ' + e.name); }
  zoomBusy = false;
  if (zoomNext !== null) { const n = zoomNext; zoomNext = null; applyZoom(n); }
}
$('zoom').oninput = (e) => applyZoom(e.target.value);
$('zIn').onclick = () => applyZoom(Number($('zoom').value) + 0.5);
$('zOut').onclick = () => applyZoom(Number($('zoom').value) - 0.5);

// স্ক্রিন যেন বন্ধ না হয়
async function keepAwake() { try { await navigator.wakeLock?.request('screen'); } catch {} }

// ================= ২. ছবি দেখানো আর সাজানো =================
function render() {
  const t = T();
  design.style.transform = `translate(-50%,-50%) translate(${t.x}px,${t.y}px) rotate(${t.r}deg) scale(${t.s})`;
  drawOverlay();
}
function applyView() {
  render();
  if (current && mode === 'align') { current.view = { ...view }; saveViews(); }
}
// পুরো ছবিটা স্ক্রিনে ধরিয়ে দাও
function fitView() {
  const w = design.naturalWidth || 1, h = design.naturalHeight || 1;
  view = { x: 0, y: 0, s: Math.min(W() / w, H() / h), r: 0 };
  applyView();
}
function fitMark() {
  const w = design.naturalWidth || 1, h = design.naturalHeight || 1;
  const top = $('top').offsetHeight, bottom = $('bottom').offsetHeight;
  const s = Math.min(W() / w, (H() - top - bottom - 16) / h) * 0.96;
  markView = { x: 0, y: (top - bottom) / 2, s, r: 0 };
  render();
}

// ---- আঙুলের gesture ----
const pointers = new Map();
let start = null, draw = null;
function gestureInfo() {
  const p = [...pointers.values()];
  if (p.length === 1) return { cx: p[0].x, cy: p[0].y, dist: 1, ang: 0 };
  const [a, b] = p;
  return { cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, dist: Math.hypot(b.x - a.x, b.y - a.y),
           ang: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI };
}
const stage = $('stage');
stage.addEventListener('pointerdown', (e) => {
  if (!current || mode === 'check' || (mode === 'align' && locked)) return;
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  // চিহ্ন মোডে ১ আঙুল = বক্স আঁকা/ট্যাপ, ২ আঙুল = ছবি সরানো/বড় করা
  draw = (mode === 'mark' && pointers.size === 1) ? { x0: e.clientX, y0: e.clientY, x1: e.clientX, y1: e.clientY } : null;
  start = { g: gestureInfo(), v: { ...T() } };
});
stage.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (draw) { draw.x1 = e.clientX; draw.y1 = e.clientY; drawOverlay(); return; }
  const g = gestureInfo(), t = T();
  t.x = start.v.x + (g.cx - start.g.cx);
  t.y = start.v.y + (g.cy - start.g.cy);
  if (pointers.size >= 2) {
    t.s = start.v.s * (g.dist / start.g.dist);
    if (mode === 'align') t.r = start.v.r + (g.ang - start.g.ang); // চিহ্ন মোডে ঘোরানো বন্ধ
  }
  render();
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (draw && pointers.size === 0) { const d = draw; draw = null; finishDraw(d); }
  if (pointers.size) start = { g: gestureInfo(), v: { ...T() } };
  if (mode === 'align') applyView(); // অবস্থান সেভ
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', (e) => { draw = null; endPointer(e); drawOverlay(); });
stage.addEventListener('wheel', (e) => {  // PC-তে টেস্টের জন্য
  if (!current || mode === 'check' || (mode === 'align' && locked)) return;
  T().s *= e.deltaY < 0 ? 1.05 : 0.95;
  mode === 'align' ? applyView() : render();
}, { passive: true });

// ================= ৩. পোস্টারের জায়গা চিহ্ন দেওয়া =================
function saveBoxes() { store('boxes', boxesAll); scores = []; good = []; drawOverlay(); }
function pushHistory() { history.push(JSON.stringify(boxes())); if (history.length > 30) history.shift(); }

function finishDraw(d) {
  if (Math.hypot(d.x1 - d.x0, d.y1 - d.y0) < 12) return tapAt(d.x0, d.y0); // ছোট নড়াচড়া = ট্যাপ
  const [u0, v0] = toMock(Math.min(d.x0, d.x1), Math.min(d.y0, d.y1));

// ---- ছবি থেকে পোস্টার নিজে খোঁজা ----
// বুদ্ধি: দেওয়ালের রং (সবচেয়ে বেশি যে রং) বাদে বাকি অংশগুলো এক একটা পোস্টার

// ================= ৪. লাইভ চেক: ঠিক জায়গায় = নীল, না হলে লাল =================
// ক্যামেরার ছবি আর ডিজাইন — দুটোকেই একই ছোট মাপে (স্ক্রিনের মতো করে) এঁকে মিলিয়ে দেখি

  cc = document.createElement('canvas'); cc.width = w; cc.height = h;

  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.clearRect(0, 0, mc.width, mc.height);
  mctx.filter = 'blur(1px)';

// একটা বক্সের স্কোর (0 থেকে 1)। null = বক্স স্ক্রিনের বাইরে

function checkTick() {
  if (mode !== 'check' || !current || !design.naturalWidth || document.hidden) return;
  ensureCanvases(); renderMock();
  if (!grabCam()) { drawOverlay(); return; }
  measureCast();
  const th = sens / 100;
  boxes().forEach((b, i) => {
    const s = scoreBox(b);
    if (s === null) { scores[i] = null; good[i] = false; return; }
    scores[i] = scores[i] == null ? s : scores[i] * 0.6 + s * 0.4;   // হঠাৎ লাফ কমাতে গড়
    const was = good[i];

    if (good[i] && !was) buzz(40);                  // ঠিক বসলে ফোন হালকা কাঁপবে

setInterval(checkTick, 220);

let allDone = false;

  el.textContent = done ? '🎉 সব পোস্টার ঠিক জায়গায়!' : `✅ ${bn(ok)}/${bn(n)} ঠিক জায়গায়`;

// ---- বক্সগুলো আঁকা ----

  }

  const t = T(), nw = design.naturalWidth, nh = design.naturalHeight;
  boxes().forEach((b, i) => {

    } else if (mode === 'mark') color = '#ffb020';
    if (fill) { polyPath(P); octx.fillStyle = fill; octx.fill(); }
    polyPath(P); octx.lineWidth = mode === 'check' ? 4 : 2.5; octx.strokeStyle = color;
    octx.setLineDash(mode === 'align' ? [8, 6] : []); octx.stroke(); octx.setLineDash([]);
    // নাম্বারের লেবেল
    octx.font = 'bold 15px system-ui, sans-serif';
    const tw = octx.measureText(label).width + 12, [lx, ly] = P[0];
    octx.fillStyle = color; octx.fillRect(lx, ly, tw, 22);
    octx.fillStyle = mode === 'mark' ? '#000' : '#fff'; octx.fillText(label, lx + 6, ly + 16);
  });
  if (draw) {
    octx.setLineDash([6, 4]); octx.strokeStyle = '#ffb020'; octx.lineWidth = 2;
    octx.strokeRect(draw.x0, draw.y0, draw.x1 - draw.x0, draw.y1 - draw.y0); octx.setLineDash([]);
  }
}
addEventListener('resize', () => { if (mode === 'mark') fitMark(); else render(); mockKey = ''; });

// ================= ৫. মোড বদলানো আর বাটন =================
const HINTS = {
  align: 'দেওয়ালের সাথে ছবিটা মিলাও: ১ আঙুলে সরাও, ২ আঙুলে বড়-ছোট/ঘোরাও। তারপর 🔒 লক করো। (ফোন স্ট্যান্ডে বসিয়ে নিলে আর নড়বে না)',
  mark: 'প্রতিটা পোস্টারের উপর ট্যাপ করো, বা ✨ চাপো। না ধরলে আঙুল টেনে বক্স আঁকো। বক্সে ট্যাপ = মুছে যাবে।',
  check: 'পোস্টার লাগাও — ঠিক জায়গায় বসলে 🟦 নীল, না হলে 🟥 লাল। ভুল বললে "কড়াকড়ি" কমাও/বাড়াও।'
};
function setMode(m) {
  mode = m; store('mode', m);
  document.body.dataset.mode = m;
  document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === m));
  $('hint').textContent = HINTS[m];
  scores = []; good = []; allDone = false; draw = null; pointers.clear();
  if (m === 'mark' && design.naturalWidth) requestAnimationFrame(fitMark); else render();
  if (m === 'check') updateStatus();
}
document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => setMode(b.dataset.tab)));

$('opacity').oninput = (e) => { design.style.opacity = e.target.value / 100; store('opacity', e.target.value); };
function setLock(v) {
  locked = v; store('locked', v);
  $('lockBtn').textContent = locked ? '🔒 লক' : '🔓 সরানো যাবে';
  $('lockBtn').classList.toggle('on', locked);
}
$('lockBtn').onclick = () => setLock(!locked);
$('diffBtn').onclick = () => $('diffBtn').classList.toggle('on', design.classList.toggle('diff'));
$('resetBtn').onclick = () => current && !locked && fitView();
$('hideBtn').onclick = () => document.body.classList.add('hide-ui');
$('showUi').onclick = () => document.body.classList.remove('hide-ui');
$('ghostBtn').onclick = () => { ghost = !ghost; store('ghost', ghost); $('ghostBtn').classList.toggle('on', ghost); drawOverlay(); };
$('sens').oninput = (e) => { sens = Number(e.target.value); store('sens', sens); };
$('fsBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.({ navigationUI: 'hide' }).catch(() => {});
};

// ================= ৬. ডিজাইন যোগ করা ও মনে রাখা (IndexedDB) =================
let db = null;
function openDB() {
  return new Promise((res) => {
    try {
      const req = indexedDB.open('poster-overlay', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('designs', { keyPath: 'id' });
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
    } catch { res(null); }
  });
}
function dbAll() {
  return new Promise((res) => {
    if (!db) return res([]);
    const r = db.transaction('designs').objectStore('designs').getAll();
    r.onsuccess = () => res(r.result || []); r.onerror = () => res([]);
  });
}
function dbPut(item) { try { db?.transaction('designs', 'readwrite').objectStore('designs').put(item); } catch {} }
function dbDel(id)   { try { db?.transaction('designs', 'readwrite').objectStore('designs').delete(id); } catch {} }
function saveViews() {
  const all = {}; designs.forEach((d) => (all[d.id] = d.view));
  store('views', all); store('current', current?.id);
}

$('file').onchange = async (e) => {
  for (const f of e.target.files) {
    const item = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), blob: f };
    dbPut(item); addDesign(item);
  }
  e.target.value = '';
  if (designs.length) select(designs[designs.length - 1]);
};
function addDesign(item, savedView) {
  const d = { id: item.id, url: URL.createObjectURL(item.blob), view: savedView || null };
  designs.push(d); renderThumbs(); return d;
}
function renderThumbs() {
  const box = $('thumbs'); box.innerHTML = '';
  designs.forEach((d) => {
    const im = document.createElement('img');
    im.src = d.url; if (d === current) im.className = 'active';
    im.onclick = () => select(d);
    box.appendChild(im);
  });
}
function select(d) {
  current = d; msg.hidden = true; history = []; scores = []; good = []; mockKey = '';
  design.onload = () => {
    prepMock();
    if (d.view) { view = { ...d.view }; render(); } else fitView();
    if (mode === 'mark') fitMark();
  };
  design.src = d.url;
  renderThumbs(); saveViews();
}
$('delBtn').onclick = () => {
  if (!current || !confirm('এই ডিজাইনটা (আর এর বক্সগুলো) মুছে ফেলবে?')) return;
  dbDel(current.id); delete boxesAll[current.id]; store('boxes', boxesAll);
  URL.revokeObjectURL(current.url);
  designs = designs.filter((d) => d !== current);
  current = null; design.removeAttribute('src'); md = null;
  if (designs.length) select(designs[0]);
  else { renderThumbs(); msg.hidden = false; drawOverlay(); }
  saveViews();
};

// ================= ৭. অ্যাপ হিসেবে ইনস্টল (PWA) =================
let installEvt = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; $('installBtn').hidden = false; });
$('installBtn').onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt(); await installEvt.userChoice.catch(() => {});
  installEvt = null; $('installBtn').hidden = true;
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ================= শুরু =================
(async function init() {
  const op = load('opacity', 50);
  $('opacity').value = op; design.style.opacity = op / 100;
  $('sens').value = sens; $('ghostBtn').classList.toggle('on', ghost);
  setLock(locked);
  setMode(load('mode', 'align'));

  db = await openDB();
  const views = load('views', {});
  (await dbAll()).forEach((it) => addDesign(it, views[it.id]));
  const last = designs.find((d) => d.id === load('current', null)) || designs[0];
  if (last) select(last);

  startCamera();
  keepAwake();
})();
</script>
